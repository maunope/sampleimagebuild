steps:
  # Step 1: Initialize Packer plugins for the Pet Shop image build
  - id: 'Packer Init Petshop'
    name: 'hashicorp/packer:latest'
    entrypoint: 'packer'
    args:
      - 'init'
      - 'packer-petshop-template.pkr.hcl'
    dir: 'petshopnode' # Set the working directory to this folder

  # Step 2: Build the Pet Shop Image
  - id: 'Packer Build Petshop'
    name: 'hashicorp/packer:latest'
    entrypoint: 'packer'
    args:
      - 'build'
      # Pass your variables to the build command
      - '-var'
      - 'project_id=${_GCP_PROJECT}'
      - '-var'
      - 'image_name=${_IMAGE_NAME}-${SHORT_SHA}'
      - 'packer-petshop-template.pkr.hcl'
    dir: 'petshopnode' # Set the working directory to this folder
    waitFor: ['Packer Init Petshop'] # Ensure initialization is complete

# Specify logging options
options:
  logging: CLOUD_LOGGING_ONLY
  # Use the same private pool for this build
  pool: 
    name: 'projects/mnosedademo/locations/europe-west4/workerPools/packer_private_pool'