---
- hosts: all
  name: Harden Debian Image (Final, Functional Version)
  # Ensure all subsequent commands run with root privileges
  become: yes
  vars:
    # Explicitly set the python interpreter path for Ansible
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - role: googlecloudplatform.google_cloud_ops_agents
      vars:
        agent_type: ops-agent
  tasks:
    - name: Wait for system to become ready (Initial OS boot)
      ansible.builtin.wait_for:
        timeout: 60
      # Run this task on the Ansible controller (localhost) while the target system boots
      delegate_to: localhost

    - name: Update apt cache and install jq
      ansible.builtin.apt:
        name: jq
        state: present
        update_cache: yes
      # Retry this task if it fails (e.g. due to apt locks)
      retries: 30
      delay: 10
      register: apt_install_result
      until: apt_install_result is succeeded

    - name: Set ulimit permanently for all users
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000