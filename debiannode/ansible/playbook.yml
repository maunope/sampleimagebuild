---
- hosts: all
  name: Harden Debian Image (Final, Shell Workaround)
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Wait for system to become ready (Initial OS boot)
      ansible.builtin.wait_for:
        timeout: 60
      delegate_to: localhost

    - name: Robustly wait for apt lock to be released and install jq (FIXED Logging)
      ansible.builtin.shell: |
        # Log the User ID and Group ID of the process running this command (root)
        echo "=========================================================================="
        echo "TASK START: APT Lock Wait and jq Install"
        echo "Running as: $(id)"
        echo "--------------------------------------------------------------------------"
        
        MAX_RETRIES=60
        SLEEP_TIME=10
        RETRIES=0
        
        LOCK_FILES="/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock"
        
        # Start loop to check for active lock-holding processes
        while [ $RETRIES -lt $MAX_RETRIES ]; do
          
          # Run lsof, capturing stdout and stderr into the LSOF_OUTPUT variable
          LSOF_OUTPUT=$(lsof $LOCK_FILES 2>&1)
          LSOF_EXIT_CODE=$?
          
          # Check if the exit code indicates locks were found (lsof returns 0 when files are open)
          if [ $LSOF_EXIT_CODE -eq 0 ]; then
            
            echo "Waiting for apt/dpkg lock to be released (Retry $((RETRIES + 1))/$MAX_RETRIES)..."
            echo "--- LSOF Output (Process holding the lock) ---"
            echo "$LSOF_OUTPUT"
            echo "----------------------------------------------"
            
            sleep $SLEEP_TIME
            RETRIES=$((RETRIES + 1))
          else
            # Exit code is not 0 (meaning no process is holding the lock files)
            echo "SUCCESS: Lock released after $RETRIES retries."
            break # Exit the while loop
          fi
          
          # Handle timeout failure
          if [ $RETRIES -eq $MAX_RETRIES ]; then
            echo "ERROR: Lock persisted after 10 minutes."
          fi
          
        done
        
        # FINAL SAFEGUARD: Force removal of common lock files (stale lock cleanup)
        # This runs whether the wait succeeded or failed.
        echo "Forcing lock clear for /var/lib/dpkg/lock* and /var/cache/apt/archives/lock"
        rm -f $LOCK_FILES
        
        # Run the update and install commands
        apt-get update
        apt-get install -y jq
        echo "=========================================================================="

      args:
        creates: /usr/bin/jq
        
    - name: Download Google Cloud Ops Agent install script
      ansible.builtin.get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Google Cloud Ops Agent
      ansible.builtin.command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /etc/google-cloud-ops-agent/config.yaml

    - name: Set ulimit permanently for all users
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000