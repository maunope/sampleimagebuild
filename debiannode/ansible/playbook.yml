---
- hosts: all
  name: Harden Debian Image (Final, Shell Workaround)
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Wait for system to become ready (Initial OS boot)
      wait_for:
        timeout: 60
      delegate_to: localhost

    - name: Robustly wait for apt lock to be released and install jq
      ansible.builtin.shell: |
        # Wait loop: Check for actively held lock files using lsof every 10 seconds.
        # This is more reliable than just checking for file existence.
        MAX_RETRIES=60
        SLEEP_TIME=10
        RETRIES=0
        
        # Check if the primary dpkg and apt lock files are held by an active process
        while (lsof /var/lib/dpkg/lock-frontend || lsof /var/lib/dpkg/lock || lsof /var/lib/apt/lists/lock) && [ $RETRIES -lt $MAX_RETRIES ]; do
          echo "Waiting for apt/dpkg lock to be released by background process..."
          sleep $SLEEP_TIME
          RETRIES=$((RETRIES + 1))
        done
        
        # FINAL SAFEGUARD: Force-clear any remaining stale lock files after waiting
        if [ $RETRIES -eq $MAX_RETRIES ]; then
            echo "WARN: Lock persisted after 10 minutes. Forcing lock clear."
        fi
        rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
        
        # Run the update command using apt-get (simple shell command)
        apt-get update
        apt-get install -y jq
      args:
        # Prevents this task from running again if the build is resumed or run on a complete image
        creates: /usr/bin/jq
        
    - name: Download Google Cloud Ops Agent install script
      get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Google Cloud Ops Agent
      command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /etc/google-cloud-ops-agent/config.yaml

    - name: Set ulimit permanently for all users
      copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000