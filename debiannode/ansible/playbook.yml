---
- hosts: all
  name: Harden Debian Image
  # Ensure all subsequent commands run with root privileges
  become: yes
  become_user: root
  vars:
    # Explicitly set the python interpreter path for Ansible
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: "DEBUG - Check which user is running this playbook"
      ansible.builtin.command: whoami
      register: whoami_result

    - name: "DEBUG - Print the username"
      ansible.builtin.debug:
        msg: "This playbook is being executed by the user: {{ whoami_result.stdout }}"

    - name: Wait for system to become ready (Initial OS boot)
      ansible.builtin.wait_for:
        timeout: 60
      # Run this task on the Ansible controller (localhost) while the target system boots
      delegate_to: localhost

    - name: Wait for apt-daily/unattended-upgrades to finish
      ansible.builtin.shell:
        cmd: "while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1 ; do sleep 5 ; done"
      changed_when: false

    - name: Add Google Cloud Apt signing key
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /etc/apt/trusted.gpg.d/google-cloud.gpg
        mode: '0644'

    - name: Add Google Cloud Ops Agent repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.cloud.google.com/apt google-cloud-ops-agent-{{ ansible_distribution_release | lower }}-all main"
        state: present
        filename: google-cloud-ops-agent

    - name: Install Ops Agent and additional packages
      ansible.builtin.apt:
        name: ['google-cloud-ops-agent', 'jq']
        state: present
        update_cache: yes

    - name: Set ulimit permanently for all users
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^{{ item.key }}'
        line: '{{ item.key }} {{ item.value }}'
        state: present
        validate: 'sshd -t -f %s'
      loop:
        - { key: 'PermitRootLogin', value: 'no' }
        - { key: 'PasswordAuthentication', value: 'no' }
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted