steps:
  # Step 1: Download the Packer executable zip file.
  # This step just produces an artifact in the shared /workspace.
  - name: 'gcr.io/cloud-builders/wget'
    args:
      - 'https://releases.hashicorp.com/packer/1.11.1/packer_1.11.1_linux_amd64.zip'
    id: 'download-packer'

  # Step 2: Run the entire Packer pipeline in a single, unified step.
  # All commands that depend on 'unzip' and the 'packer' executable must run
  # in the same step because each Cloud Build step runs in a fresh container.
  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install the 'unzip' utility
        apt-get update && apt-get install -y unzip

        # Install ca-certificates to resolve TLS verification issues when downloading Packer plugins
        apt-get install -y ca-certificates

        # Unzip the Packer archive into the current directory (/workspace)
        unzip -o packer_1.11.1_linux_amd64.zip

        # Make the extracted 'packer' binary executable
        chmod +x packer

        # Initialize Packer to download the required 'googlecompute' plugin
        ./packer init packer-template.pkr.hcl

        # Validate the Packer template with the provided substitution variables
        ./packer validate \
          -var "project_id=${_GCP_PROJECT}" \
          -var "image_name=${_IMAGE_NAME}-${SHORT_SHA}" \
          packer-template.pkr.hcl

        # Build the VM image using the Packer template
        ./packer build \
          -var "project_id=${_GCP_PROJECT}" \
          -var "image_name=${_IMAGE_NAME}-${SHORT_SHA}" \
          packer-template.pkr.hcl
    # This step only needs to wait for the Packer zip file to be downloaded.
    waitFor: ['download-packer']
    id: 'packer-pipeline'

# Specify logging options, which is required when using a custom service account.
options:
  logging: CLOUD_LOGGING_ONLY
