steps:
# ----------------------------------------------------------------------
# Step 1: Initialize Packer (Download Plugins)
# This step uses the official HashiCorp builder image.
# It automatically runs 'packer init' and downloads the plugin 
# (hashicorp/google-compute 1.2.4) into the shared workspace.
# ----------------------------------------------------------------------
- id: 'Packer Init'
  name: 'hashicorp/packer:latest' # Use the official builder image
  entrypoint: 'packer'
  args:
    - 'init'
    - 'packer-template.pkr.hcl'

# ----------------------------------------------------------------------
# Step 2: Build the Image (Validate and Execute)
# This step automatically picks up the initialized plugins from the 
# previous step's shared workspace.
# ----------------------------------------------------------------------
- id: 'Packer Build'
  name: 'hashicorp/packer:latest' # Use the same official builder image
  entrypoint: 'packer'
  args:
    # We combine validate and build in one script command for simplicity,
    # or you can use the 'build' command which performs validation automatically.
    - 'build'
    # Pass your variables to the build command
    - '-var'
    - 'project_id=${_GCP_PROJECT}'
    - '-var'
    - 'image_name=${_IMAGE_NAME}-${SHORT_SHA}'
    - 'packer-template.pkr.hcl'
  # Ensure this step waits for initialization to complete
  waitFor: ['Packer Init']

# Specify logging options (This block is fine)
options:
  logging: CLOUD_LOGGING_ONLY