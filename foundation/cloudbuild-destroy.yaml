steps:
  # Step 1: Initialize Terraform
  # This step initializes the backend, downloads providers, and sets up the workspace.
  - id: 'Terraform Init'
    name: 'hashicorp/terraform:1.8.5'
    entrypoint: 'terraform'
    args:
      - 'init'
      - '-backend-config=bucket=${PROJECT_ID}-tf-state'
    dir: 'foundation'

  # Step 2: Terraform Destroy
  # This step destroys all resources managed by this Terraform configuration.
  - id: 'Terraform Destroy'
    name: 'hashicorp/terraform:1.8.5'
    entrypoint: 'terraform'
    args:
      - 'destroy'
      - '-auto-approve'
      - '-var=project_id=${_PROJECT_ID}'
      - '-var=region=${_REGION}'
    dir: 'foundation'
    waitFor: ['Terraform Init']

options:
  logging: CLOUD_LOGGING_ONLY