<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pet Shop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 960px;
            margin: auto;
            text-align: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .cta-button {
            display: inline-block;
            background-color: #ff7043;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .cta-button:hover {
            background-color: #f4511e;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>

<body>
    <header class="container">
        The Pet Shop
    </header>

    <main class="container">
        <h1>Welcome to Your Favorite Pet Store!</h1>
        <p>Your one-stop shop for all your furry, scaly, and feathery friends.</p>
        <p>We are built and deployed using a fully automated CI/CD pipeline with Packer and Cloud Build!</p>
        <a href="products.html" class="cta-button">See Our Products</a>
    </main>

    <footer class="container">
        <p>&copy; 2025 The Pet Shop. All Rights Reserved.</p>
    </footer>
</body>

</html>
