<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pet Shop - Unleash Joy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        :root {
            --primary-color: #2980b9;
            /* A deep, trustworthy blue */
            --secondary-color: #2c3e50;
            /* Dark slate for text */
            --accent-color: #f39c12;
            /* A vibrant, friendly orange */
            --bg-color: #ecf0f1;
            /* A very light grey background */
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--secondary-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s ease-out, background-color 0.2s;
        }

        .cta-button:hover {
            background-color: #e67e22;
            transform: translateY(-3px);
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>

<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">The Pet Shop</a>
            <a href="products.html" class="cta-button">Our Products</a>
        </nav>
    </header>

    <main>
        <div class="hero container">
            <h1>Unleash Joy.</h1>
            <p>Discover everything you need for your furry, scaly, and feathery friends. Quality products, delivered
                with love, powered by a fully automated CI/CD pipeline!</p>
            <a href="products.html" class="cta-button">Explore Our Collection</a>
        </div>
    </main>

    <footer class="container">
        <p>&copy; 2025 The Pet Shop. All Rights Reserved.</p>
    </footer>
</body>

</html>
