<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - The Pet Shop</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 960px;
            margin: auto;
            text-align: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .product-list {
            list-style-type: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .product-list li {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 200px;
        }

        .back-button {
            display: inline-block;
            background-color: #757575;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 30px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>

<body>
    <header class="container">
        The Pet Shop
    </header>

    <main class="container">
        <h1>Our Awesome Pet Products</h1>
        <ul class="product-list">
            <li>Premium Dog Food</li>
            <li>Interactive Cat Toys</li>
            <li>Spacious Fish Tanks</li>
            <li>Colorful Bird Cages</li>
        </ul>
        <a href="index.html" class="back-button">Back to Home</a>
    </main>

    <footer class="container">
        <p>&copy; 2025 The Pet Shop. All Rights Reserved.</p>
    </footer>
</body>

</html>
