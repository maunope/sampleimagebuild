


steps:
  # Step 1: Initialize Packer plugins
  # Use the official HashiCorp Packer image. It comes with Packer pre-installed.
  # 'packer init' will download the required plugins based on packer-template.pkr.hcl.
  - id: 'Packer Init'
    name: 'hashicorp/packer:latest' # Use the official Packer builder image
    entrypoint: 'packer'
    args:
      - 'init'
      - 'packer-template.pkr.hcl'
    dir: 'customimage' # MODIFIED: Set the working directory to where the packer file is.

  # Step 2: Build the Image
  # This step uses the same official Packer image. It will find the initialized
  # plugins from the previous step's shared workspace.
  - id: 'Packer Build'
    name: 'hashicorp/packer:latest' # Use the same official Packer builder image
    entrypoint: 'packer'
    args:
      - 'build'
      # Pass your variables to the build command
      - '-var'
      - 'project_id=${_GCP_PROJECT}'
      - '-var'
      - 'image_name=${_IMAGE_NAME}-${SHORT_SHA}'
      - 'packer-template.pkr.hcl'
    dir: 'customimage' # MODIFIED: Set the working directory to where the packer file is.
    waitFor: ['Packer Init'] # Ensure initialization is complete

# Specify logging options (This is fine)
options:
  logging: CLOUD_LOGGING_ONLY
  # ADDED: Specify the worker pool for this build.
  # This name must match the name of the pool created in Terraform.
  pool: 
    name: 'projects/mnosedademo/locations/europe-west4/workerPools/packer_private_pool'