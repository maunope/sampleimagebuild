---
- hosts: all
  name: Harden Debian Image (Final, Stable Version)
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    # 1. REMOVE the "Wait for system to become ready" task (handled by Packer)

    # 2. REMOVE the "Stop unattended-upgrades" task (it fails due to systemd issues)

    # 3. REMOVE the "Ensure apt locks are completely cleared" task (apt will clear it if no process holds it)

    - name: Update apt cache and install jq
      apt:
        name: jq
        state: present
        update_cache: yes
        # Keep lock_timeout as the only defense against brief lock acquisition
        lock_timeout: 120 
      
    - name: Download Google Cloud Ops Agent install script
      get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Google Cloud Ops Agent
      command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /etc/google-cloud-ops-agent/config.yaml

    - name: Set ulimit permanently for all users
      copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000