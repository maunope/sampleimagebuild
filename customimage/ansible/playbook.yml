---
- hosts: all
  name: Harden Debian Image
  become: yes
  vars:
    # Set this to prevent interpreter discovery warnings.
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Wait for system to become ready
      wait_for:
        # Increased wait time for better reliability in a cloud environment
        timeout: 60 
      delegate_to: localhost

    - name: Ensure apt locks are cleared (Safeguard against stale locks)
      ansible.builtin.shell: |
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/dpkg/lock
        rm -f /var/cache/apt/archives/lock
      args:
        warn: false
      failed_when: false

    - name: Update apt cache and install jq
      apt:
        name: jq
        state: present
        update_cache: yes
        # ADDED: Wait up to 120 seconds (2 minutes) for the lock to be released 
        # by any concurrent process (like GCE's initial setup).
        lock_timeout: 120
      
    - name: Download Google Cloud Ops Agent install script
      get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Google Cloud Ops Agent
      command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /etc/google-cloud-ops-agent/config.yaml

    - name: Set ulimit permanently for all users
      copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000