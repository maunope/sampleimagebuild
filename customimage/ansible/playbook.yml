---
- hosts: all
  name: Harden Debian Image
  become: yes
  vars:
    # Set this to prevent interpreter discovery warnings.
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Wait for system to become ready (Initial OS boot)
      wait_for:
        timeout: 60
      delegate_to: localhost

    - name: Wait for apt/dpkg to release the lock (Wait up to 10 minutes)
      ansible.builtin.wait_for:
        path: /var/lib/dpkg/lock-frontend
        state: absent
        timeout: 600 # 👈 Set to 600 seconds (10 minutes) as requested
        msg: "APT lock held for too long. Increase the timeout if this error persists."
      
    - name: Ensure apt locks are completely cleared (Cleanup any remaining stale lock files)
      ansible.builtin.shell: |
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/dpkg/lock
        rm -f /var/cache/apt/archives/lock
      args:
        warn: false
      failed_when: false

    - name: Update apt cache and install jq
      apt:
        name: jq
        state: present
        update_cache: yes
        # Secondary defense: Instructs the apt module to retry for 2 minutes if the lock is briefly acquired.
        lock_timeout: 120 
      
    - name: Download Google Cloud Ops Agent install script
      get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Google Cloud Ops Agent
      command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
      args:
        creates: /etc/google-cloud-ops-agent/config.yaml

    - name: Set ulimit permanently for all users
      copy:
        dest: /etc/security/limits.d/99-packer.conf
        content: |
          * soft nofile 64000
          * hard nofile 64000